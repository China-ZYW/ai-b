# =============================================================================
# aibi CI：后端测试 + 前端构建 + 凭据泄露扫描
#
# 触发：PR / push 到 main 与 dev；也可手动 dispatch
# 门禁：任一 job 失败即阻断合并（在仓库 Branch protection 中 required checks）
# =============================================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一 PR 后续 push 会取消上一次未完成的 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---------- 凭据/敏感信息扫描（阻塞最快）----------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect local absolute paths (Windows drive letter / user home)
        run: |
          set -e
          # 命中示例：D:\soft\、C:\Users\<name>\、/home/<name>/.m2、/Users/<name>/
          # ERE 里一个反斜杠写作 \\；shell 单引号不做转义，原样传入 grep
          if grep -RIn --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git --exclude-dir=docs \
              -E '([A-Za-z]:\\(Users|soft|Program Files|workspace)|C:\\Users\\[A-Za-z0-9._-]+|/home/[a-z0-9._-]+/\.m2|/Users/[A-Za-z0-9._-]+/)' \
              . ; then
            echo "::error::Found local absolute paths. Please scrub before commit (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "No local absolute paths detected."
      - name: Detect obvious secret patterns
        run: |
          set -e
          if grep -RIn --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
              -E '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AIBI_CIPHER_KEY=[A-Za-z0-9+/]{32,}|JWT_SECRET=[A-Za-z0-9+/=]{32,})' \
              . ; then
            echo "::error::Potential secret material committed. Rotate + remove + rewrite history."
            exit 1
          fi
          echo "No obvious secret patterns detected."

  # ---------- 后端：编译 + 单测 ----------
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile
      - name: Test
        # 单测均为纯逻辑（无 DB / 无网络 / 无 SpringBootTest），可直接跑
        run: mvn -B test
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  # ---------- 前端：类型检查 + 构建 ----------
  frontend:
    name: Frontend (vue-tsc + vite build)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --prefer-offline --no-audit
      - name: Build (runs vue-tsc + vite build)
        run: npm run build
      - name: Upload dist artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ---------- 文档链接检查（轻量）----------
  docs-link:
    name: Docs link sanity
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Check referenced docs exist (README / docs/README)
        run: |
          set -e
          python3 - <<'PY'
          import re, os, sys
          bad = []
          for base in ['README.md', 'docs/README.md']:
              if not os.path.exists(base): continue
              text = open(base, encoding='utf-8').read()
              for m in re.finditer(r'\[[^\]]+\]\((?!https?://)([^)]+)\)', text):
                  link = m.group(1).split('#', 1)[0].strip()
                  if not link: continue
                  target = os.path.normpath(os.path.join(os.path.dirname(base), link))
                  if not os.path.exists(target):
                      bad.append(f'{base}: {link} -> {target}')
          if bad:
              print('Broken local links:')
              for b in bad: print(' -', b)
              sys.exit(1)
          print('All local doc links resolve.')
          PY
