name: "✨ 功能建议 / Feature Request"
description: "提出一个新能力或改进建议"
title: "[feat] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请尽量描述**使用场景**而非具体实现，方案在评审时再讨论。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem statement
      description: 用一句话说明"作为 <角色>，我想 <动作>，但 <障碍>"
      placeholder: 作为数据分析师，我希望在同一个会话里切换数据源，但当前必须回到列表页重新进入。
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望它如何工作；可接受的折中亦可
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      placeholder: 例如：接受必须重进，但保留会话上下文（刷新后仍在同一 thread）。
    validations: { required: false }

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Affected scope
      multiple: true
      options:
        - 后端 (backend)
        - 前端 (frontend)
        - MCP 协议 (mcp)
        - 数据源接入 (datasource)
        - 部署/运维 (deploy/ops)
        - 文档 (docs)
    validations: { required: true }

  - type: textarea
    id: context
    attributes:
      label: 附加上下文 / Additional context
      description: 相关 Issue / PR / 竞品做法 / 截图
    validations: { required: false }

  - type: checkboxes
    id: help
    attributes:
      label: 参与度 / Willingness to help
      options:
        - { label: "我愿意提交 PR 实现该功能" }
        - { label: "我愿意参与方案评审与测试" }
